apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditlens
  namespace: lending
spec:
  replicas: 3
  selector:
    matchLabels: {app: creditlens}
  template:
    metadata:
      labels: {app: creditlens}
    spec:
      containers:
        - name: api
          image: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/creditlens:3.1.0
          args: ["uvicorn", "service.app:app", "--host", "0.0.0.0", "--port", "8443",
                 "--ssl-keyfile", "/tls/tls.key", "--ssl-certfile", "/tls/tls.crt"]
          volumeMounts: [{name: tls, mountPath: /tls, readOnly: true}]
      volumes:
        - name: tls
          secret: {secretName: creditlens-tls}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: creditlens-ingress
  namespace: lending
spec:
  podSelector: {matchLabels: {app: creditlens}}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {name: origination}}
      ports: [{port: 8443}]
