name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml
      - name: Install ccauditor
        run: pip install -e ".[dev]"
      - name: Unit tests (live LLM tests are skipped)
        run: pytest -q
      - name: Validate benchmark corpus
        working-directory: .
        run: |
          if [ -f app/benchmark/validate_corpus.py ]; then python app/benchmark/validate_corpus.py; fi
      - name: CLI smoke test
        working-directory: .
        run: |
          ccauditor policies
          ccauditor audit app/benchmark/apps/hireright-screening -m deterministic -f md -o /tmp/report.md
          head -20 /tmp/report.md

  web:
    name: web (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
