[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccauditor"
version = "0.1.0"
description = "Compliance-as-Code AI Auditor: maps policy requirements to repository evidence."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ccauditor = "ccauditor.cli:app"

[tool.setuptools.packages.find]
include = ["ccauditor*"]

[tool.setuptools.package-data]
ccauditor = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
