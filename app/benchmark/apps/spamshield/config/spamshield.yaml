  retention_days: 30
logging:
  sink: loki
  retention_days: 180
tls:
  cert: /etc/spamshield/tls/tls.crt
  key: /etc/spamshield/tls/tls.key
  client_ca: /etc/spamshield/tls/gateway-ca.crt
